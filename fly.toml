# StreamTV — publication sur Fly.io (https://fly.io/docs/reference/configuration/).
#   fly launch --no-deploy --copy-config --name streamtv-demo
#   fly volumes create streamtv_data --size 1
#   fly secrets set ADMIN_PASSWORD=...
#   fly deploy
app = "streamtv-demo"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  HTTPS = "1"
  PORT = "3000"

[[mounts]]
  source = "streamtv_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
